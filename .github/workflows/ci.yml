name: CNlottor CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install unified launcher
        run: python -m pip install -e .

      - name: Verify unified launcher
        run: |
          cnlottor list
          python cnlottor.py list

      - name: Run integration tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: |
          python -m py_compile cnlottor.py tests/test_launcher.py
          python -m compileall -q modules/predict_tensorflow
          python -m compileall -q modules/predict_pytorch
          python -m compileall -q modules/kl8_analyzer

      - name: Verify imported structure and notices
        run: |
          test -f modules/predict_tensorflow/README.md
          test -f modules/predict_tensorflow/LICENSE
          test -f modules/predict_pytorch/README.md
          test -f modules/predict_pytorch/setup.py
          test -f modules/kl8_analyzer/README.md
          test -f modules/kl8_analyzer/LICENSE
          test -f LICENSES/predict_Lottery_ticket-GPL-3.0.txt
          test -f LICENSES/kl8-lottery-analyzer-MIT.txt
          test -f SOURCES.md
          test -f THIRD_PARTY_NOTICES.md
