# The default-branch PR bootstrap supersedes this branch-local fallback.
# Retry marker: generated workflow files are removed before the source push.
name: Bootstrap CNlottor v1 branch

on:
  push:
    branches: [agent/cnlottor-v1-build]
    paths: [.github/workflows/bootstrap-v1-branch.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cnlottor-v1-build
      - run: echo "Source generation is handled by the default-branch PR workflow."
