# The default-branch PR bootstrap supersedes this branch-local fallback.
name: Bootstrap CNlottor v1 branch

on:
  push:
    branches: [agent/cnlottor-v1-build]
    paths: [.github/workflows/bootstrap-v1-branch.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cnlottor-v1-build
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platforms and v1 code
        run: |
          rm -rf clients/cnlottor_app
          flutter create --platforms=android,windows --org com.b8vipvip clients/cnlottor_app
          python scripts/bootstrap_v1.py
          rm -f .github/workflows/bootstrap-v1-branch.yml
      - name: Validate generated source
        run: |
          python -m pip install -e ".[data,yaml,analysis,server,dev]"
          python -m unittest discover -s tests -v
          python -m compileall -q src
          cd clients/cnlottor_app
          flutter pub get
          flutter analyze
          flutter test
      - name: Push generated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build CNlottor v0.3 backend and clients"
          git push origin HEAD:agent/cnlottor-v1-build
