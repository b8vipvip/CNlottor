name: Bootstrap CNlottor v1 PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap-cnlottor-v1-pr
  cancel-in-progress: false

jobs:
  generate:
    if: github.head_ref == 'agent/cnlottor-v1-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate backend and clients
        run: |
          rm -rf clients/cnlottor_app
          flutter create --platforms=android,windows --org com.b8vipvip clients/cnlottor_app
          python scripts/bootstrap_v1.py
          rm -f .github/workflows/bootstrap-v1-branch.yml
          rm -f .github/workflows/bootstrap-v1-pr.yml
      - name: Validate Python backend
        run: |
          python -m pip install -e ".[data,yaml,analysis,server,dev]"
          python -m unittest discover -s tests -v
          python -m compileall -q src
      - name: Validate Flutter client
        working-directory: clients/cnlottor_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit generated release
        run: |
          git add -A
          git commit -m "Build CNlottor v0.3 backend and clients"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
