name: Bootstrap CNlottor v1 PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bootstrap-cnlottor-v1-pr
  cancel-in-progress: false

jobs:
  generate:
    if: github.head_ref == 'agent/cnlottor-v1-build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate backend and clients
        run: |
          rm -rf clients/cnlottor_app
          flutter create --platforms=android,windows --org com.b8vipvip clients/cnlottor_app
          python scripts/bootstrap_v1.py
          cat > src/cnlottor/analysis_engine/__init__.py <<'PY'
          from .backtest import RollingBacktester, frequency_prediction, random_prediction, score_prediction
          from .contracts import AnalysisStrategy
          from .copula import CopulaConfig, GenericCopulaGenerator
          from .rules import AssociationRuleAnalyzer
          from .service import AnalysisService
          from .statistics import co_occurrence_analysis, draw_shape_analysis, frequency_analysis

          __all__ = [
              "AnalysisStrategy", "AnalysisService", "frequency_analysis", "draw_shape_analysis",
              "co_occurrence_analysis", "AssociationRuleAnalyzer", "CopulaConfig",
              "GenericCopulaGenerator", "RollingBacktester", "frequency_prediction",
              "random_prediction", "score_prediction",
          ]
          PY
          python - <<'PY'
          from pathlib import Path

          client = Path("clients/cnlottor_app/lib/main.dart")
          text = client.read_text(encoding="utf-8")
          text = text.replace(
              "DropdownButtonFormField<String>(\n              value: selected,",
              "DropdownButtonFormField<String>(\n              key: ValueKey(selected),\n              initialValue: selected,",
          )
          client.write_text(text, encoding="utf-8", newline="\n")
          PY
          git restore --source=HEAD -- .github/workflows
      - name: Validate Python backend
        run: |
          python -m pip install -e ".[data,yaml,analysis,server,dev]"
          python -m unittest discover -s tests -v
          python -m compileall -q src
      - name: Validate Flutter client
        working-directory: clients/cnlottor_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit generated source
        run: |
          rm -rf src/cnlottor.egg-info
          git add -A
          git commit -m "Build CNlottor v0.3 backend and clients"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
