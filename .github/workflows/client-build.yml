name: CNlottor Client Build

on:
  pull_request:
    paths:
      - "clients/cnlottor_app/**"
      - "src/cnlottor/**"
      - "tools/windows/**"
      - "pyproject.toml"
      - ".github/workflows/client-build.yml"
  push:
    branches: [main, agent/cnlottor-v1-build]
    paths:
      - "clients/cnlottor_app/**"
      - "src/cnlottor/**"
      - "tools/windows/**"
      - "pyproject.toml"
      - ".github/workflows/client-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: clients/cnlottor_app
        run: flutter pub get
      - name: Analyze and test
        working-directory: clients/cnlottor_app
        run: |
          flutter analyze
          flutter test
      - name: Build release APK
        working-directory: clients/cnlottor_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CNlottor-Android-APK
          path: clients/cnlottor_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $Tokens = $null
          $Errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools\windows\start_server.ps1"),
            [ref]$Tokens,
            [ref]$Errors
          ) | Out-Null
          if ($Errors.Count -gt 0) {
            $Errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell launcher contains syntax errors."
          }
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Resolve Flutter packages
        working-directory: clients/cnlottor_app
        run: flutter pub get
      - name: Analyze and test
        working-directory: clients/cnlottor_app
        run: |
          flutter analyze
          flutter test
      - name: Build Windows release
        working-directory: clients/cnlottor_app
        run: flutter build windows --release
      - name: Build server wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Assemble Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\app | Out-Null
          New-Item -ItemType Directory -Force -Path package\server | Out-Null
          Copy-Item -Recurse -Force clients\cnlottor_app\build\windows\x64\runner\Release\* package\app\
          Copy-Item -Force dist\*.whl package\server\
          Copy-Item -Force tools\windows\start_server.ps1 package\start_server.ps1
          Copy-Item -Force tools\windows\使用说明.txt package\使用说明.txt
          Copy-Item -Force README.md package\项目完整说明.md
          New-Item -ItemType Directory -Force -Path package\data | Out-Null
          New-Item -ItemType Directory -Force -Path package\artifacts\models | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: CNlottor-Windows
          path: package
          if-no-files-found: error
