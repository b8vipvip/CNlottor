name: Import and merge KittenCN lottery projects

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-and-merge.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-kittencn-lottery-projects
  cancel-in-progress: false

jobs:
  import-and-merge:
    runs-on: ubuntu-latest
    env:
      BRANCH: agent/merge-kittencn-lottery-projects
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stop when branch already exists
        id: branch_check
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $BRANCH already exists; skipping import."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create integration branch
        if: steps.branch_check.outputs.exists == 'false'
        run: git switch -c "$BRANCH"

      - name: Import TensorFlow project as subtree
        if: steps.branch_check.outputs.exists == 'false'
        run: |
          git remote add upstream-tensorflow https://github.com/KittenCN/predict_Lottery_ticket.git
          git fetch --depth=1 upstream-tensorflow main
          echo "TF_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git subtree add --prefix=modules/predict_tensorflow upstream-tensorflow main --squash

      - name: Import PyTorch project as subtree
        if: steps.branch_check.outputs.exists == 'false'
        run: |
          git remote add upstream-pytorch https://github.com/KittenCN/predict_Lottery_ticket_pytorch.git
          git fetch --depth=1 upstream-pytorch master
          echo "PYTORCH_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git subtree add --prefix=modules/predict_pytorch upstream-pytorch master --squash

      - name: Import KL8 analyzer as subtree
        if: steps.branch_check.outputs.exists == 'false'
        run: |
          git remote add upstream-kl8 https://github.com/KittenCN/kl8-lottery-analyzer.git
          git fetch --depth=1 upstream-kl8 main
          echo "KL8_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
          git subtree add --prefix=modules/kl8_analyzer upstream-kl8 main --squash

      - name: Add unified project layer
        if: steps.branch_check.outputs.exists == 'false'
        shell: bash
        run: |
          cat > cnlottor.py <<'PY'
          #!/usr/bin/env python3
          """Unified local launcher for the three imported lottery research modules."""

          from __future__ import annotations

          import argparse
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parent
          MODULES = {
              "tensorflow": ROOT / "modules" / "predict_tensorflow",
              "pytorch": ROOT / "modules" / "predict_pytorch",
              "kl8": ROOT / "modules" / "kl8_analyzer",
          }


          def module_path(name: str) -> Path:
              path = MODULES[name]
              if not path.is_dir():
                  raise SystemExit(f"Module directory is missing: {path}")
              return path


          def cmd_list(_: argparse.Namespace) -> int:
              for name, path in MODULES.items():
                  status = "available" if path.is_dir() else "missing"
                  print(f"{name:10} {status:9} {path.relative_to(ROOT)}")
              return 0


          def cmd_install(args: argparse.Namespace) -> int:
              path = module_path(args.module)
              requirements = path / "requirements.txt"
              if not requirements.is_file():
                  raise SystemExit(f"No requirements.txt found in {path}")
              command = [sys.executable, "-m", "pip", "install", "-r", str(requirements)]
              return subprocess.call(command, cwd=path)


          def cmd_exec(args: argparse.Namespace) -> int:
              path = module_path(args.module)
              command = list(args.command)
              if command and command[0] == "--":
                  command = command[1:]
              if not command:
                  raise SystemExit("Provide a command after '--'.")
              return subprocess.call(command, cwd=path)


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(
                  description="Manage and run the imported CNlottor modules."
              )
              subparsers = parser.add_subparsers(dest="action", required=True)

              list_parser = subparsers.add_parser("list", help="List integrated modules")
              list_parser.set_defaults(func=cmd_list)

              install_parser = subparsers.add_parser(
                  "install", help="Install a module's requirements"
              )
              install_parser.add_argument("module", choices=MODULES)
              install_parser.set_defaults(func=cmd_install)

              exec_parser = subparsers.add_parser(
                  "exec", help="Run a command inside a module directory"
              )
              exec_parser.add_argument("module", choices=MODULES)
              exec_parser.add_argument("command", nargs=argparse.REMAINDER)
              exec_parser.set_defaults(func=cmd_exec)
              return parser


          def main() -> int:
              args = build_parser().parse_args()
              return int(args.func(args))


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
          chmod +x cnlottor.py

          mkdir -p tests LICENSES
          cat > tests/test_launcher.py <<'PY'
          import subprocess
          import sys
          import unittest
          from pathlib import Path


          class LauncherTest(unittest.TestCase):
              def test_list_contains_all_modules(self):
                  root = Path(__file__).resolve().parents[1]
                  result = subprocess.run(
                      [sys.executable, str(root / "cnlottor.py"), "list"],
                      cwd=root,
                      text=True,
                      capture_output=True,
                      check=True,
                  )
                  for name in ("tensorflow", "pytorch", "kl8"):
                      self.assertIn(name, result.stdout)
                      self.assertIn("available", result.stdout)


          if __name__ == "__main__":
              unittest.main()
          PY

          cat > pyproject.toml <<'TOML'
          [project]
          name = "cnlottor"
          version = "0.1.0"
          description = "Unified workspace for KittenCN lottery research projects"
          requires-python = ">=3.9"

          [project.scripts]
          cnlottor = "cnlottor:main"
          TOML

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          .venv/
          venv/
          env/
          data/
          models/
          checkpoints/
          *.ckpt
          *.h5
          *.keras
          *.pt
          *.pth
          EOF

          cat > README.md <<'MD'
          # CNlottor

          CNlottor 将 KittenCN 的三个彩票数据研究项目聚合在一个仓库中，并提供统一的本地管理入口。项目仅用于编程、数据分析和机器学习研究，不构成投资或中奖承诺。

          ## 集成模块

          | 模块 | 目录 | 用途 |
          |---|---|---|
          | TensorFlow 预测系统 | `modules/predict_tensorflow` | 双色球、大乐透、排列三、七星彩、福彩3D等历史数据与 LSTM 实验 |
          | PyTorch 预测系统 | `modules/predict_pytorch` | Transformer/LSTM、训练、预测与数据 Pipeline |
          | KL8 分析器 | `modules/kl8_analyzer` | 快乐8统计分析、候选组合、回测及高级算法实验 |

          ## 统一入口

          ```bash
          python cnlottor.py list
          python cnlottor.py install pytorch
          python cnlottor.py exec pytorch -- python scripts/get_data.py --help
          python cnlottor.py exec tensorflow -- python main.py --help
          ```

          `exec` 命令只负责切换到对应模块目录并执行原项目命令，因此各模块仍可按照自己的 README 独立使用，避免强行混合不同框架的依赖和数据格式。

          ## 目录结构

          ```text
          CNlottor/
          ├── cnlottor.py
          ├── modules/
          │   ├── predict_tensorflow/
          │   ├── predict_pytorch/
          │   └── kl8_analyzer/
          ├── tests/
          ├── SOURCES.md
          └── THIRD_PARTY_NOTICES.md
          ```

          ## 安装建议

          三个上游项目使用 TensorFlow、PyTorch 和不同版本的数据科学依赖。建议为每个模块使用独立虚拟环境，避免依赖冲突。

          ## 许可证

          本仓库是多许可证聚合项目。每个上游模块继续适用其原许可证和版权声明；详情见 `THIRD_PARTY_NOTICES.md`、`SOURCES.md` 及模块内原始文件。
          MD

          cat > SOURCES.md <<MD
          # Imported sources

          The repository was assembled from the following upstream snapshots:

          | Local path | Upstream repository | Imported ref | Imported commit |
          |---|---|---|---|
          | \`modules/predict_tensorflow\` | \`KittenCN/predict_Lottery_ticket\` | \`main\` | \`${TF_SHA}\` |
          | \`modules/predict_pytorch\` | \`KittenCN/predict_Lottery_ticket_pytorch\` | \`master\` | \`${PYTORCH_SHA}\` |
          | \`modules/kl8_analyzer\` | \`KittenCN/kl8-lottery-analyzer\` | \`main\` | \`${KL8_SHA}\` |

          The modules were imported as squashed Git subtrees. Their original repository URLs, documentation, copyright notices, and license-related metadata are retained inside each module.
          MD

          cat > THIRD_PARTY_NOTICES.md <<'MD'
          # Third-party notices

          This repository is an aggregate workspace containing separately maintained upstream projects.

          ## `modules/predict_tensorflow`

          Source: `KittenCN/predict_Lottery_ticket`  
          License file supplied upstream: GNU General Public License version 3.

          ## `modules/predict_pytorch`

          Source: `KittenCN/predict_Lottery_ticket_pytorch`  
          The upstream `setup.py` declares the package classifier `License :: OSI Approved :: MIT License`. At import time, the upstream root did not contain a standalone `LICENSE` file. This notice records that fact without replacing or inventing upstream license text.

          ## `modules/kl8_analyzer`

          Source: `KittenCN/kl8-lottery-analyzer`  
          License file supplied upstream: MIT License, copyright KittenCN.

          The repository-level launcher, tests, and integration documentation are newly added aggregation code. Do not remove upstream notices from the imported module directories.
          MD

          cp modules/predict_tensorflow/LICENSE LICENSES/predict_Lottery_ticket-GPL-3.0.txt
          cp modules/kl8_analyzer/LICENSE LICENSES/kl8-lottery-analyzer-MIT.txt

          # Remove the one-shot workflow from the integration branch so it will
          # disappear after this PR is merged and cannot accidentally re-import.
          rm -f .github/workflows/import-and-merge.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git add README.md SOURCES.md THIRD_PARTY_NOTICES.md LICENSES cnlottor.py pyproject.toml .gitignore tests .github || true
          git commit -m "Add unified CNlottor workspace and launcher"

      - name: Validate integration
        if: steps.branch_check.outputs.exists == 'false'
        run: |
          python cnlottor.py list
          python -m unittest discover -s tests -v
          python -m py_compile cnlottor.py tests/test_launcher.py
          test -f modules/predict_tensorflow/README.md
          test -f modules/predict_pytorch/README.md
          test -f modules/kl8_analyzer/README.md
          test -f LICENSES/predict_Lottery_ticket-GPL-3.0.txt
          test -f LICENSES/kl8-lottery-analyzer-MIT.txt

      - name: Push integration branch
        if: steps.branch_check.outputs.exists == 'false'
        run: git push --set-upstream origin "$BRANCH"

      - name: Open draft pull request
        if: steps.branch_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/pr-body.md <<'MD'
          ## What changed

          - imported `KittenCN/predict_Lottery_ticket` as a squashed Git subtree
          - imported `KittenCN/predict_Lottery_ticket_pytorch` as a squashed Git subtree
          - imported `KittenCN/kl8-lottery-analyzer` as a squashed Git subtree
          - added a unified `cnlottor.py` launcher for listing, installing, and executing modules
          - added source provenance, multi-license notices, and basic integration tests
          - removed the one-shot import workflow from the proposed branch

          ## Integration approach

          The three projects remain isolated under `modules/` because TensorFlow, PyTorch, and the KL8 analyzer have different dependencies, data formats, and runtime assumptions. The repository-level launcher provides one management surface without overwriting upstream files or forcing incompatible environments together.

          ## Validation

          - `python cnlottor.py list`
          - `python -m unittest discover -s tests -v`
          - Python compile checks
          - required module README and license-file checks

          ## Licensing note

          The TensorFlow module retains GPL-3.0. The KL8 module retains MIT. The PyTorch package metadata declares MIT, while its upstream root did not contain a standalone LICENSE file at import time; this is documented in `THIRD_PARTY_NOTICES.md`.
          MD
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "$BRANCH" \
            --draft \
            --title "Merge KittenCN lottery projects into CNlottor" \
            --body-file /tmp/pr-body.md
