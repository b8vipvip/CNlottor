name: CNlottor Provider Smoke

on:
  pull_request:
    paths:
      - "src/cnlottor/data_engine/**"
      - "src/cnlottor/core/registry.py"
      - "configs/lotteries/**"
      - "scripts/smoke_live_providers.py"
      - ".github/workflows/provider-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data engine
        run: python -m pip install -e ".[data,yaml]"
      - name: Validate live lottery providers
        run: python scripts/smoke_live_providers.py
